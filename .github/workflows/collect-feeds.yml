name: Recoger candidatas (RSS)

on:
  schedule:
    # GitHub no admite zona horaria y su programador es "best effort": con carga alta retrasa o DESCARTA ejecuciones
    # (así se perdieron las dos del 19-nov-2026). Por eso hay cuatro intentos en minutos poco concurridos (evitando :00 y :30).
    # Cada intento solo hace commit si hay cambios. Además, las tareas de Destacadas y Breves lanzan esta recogida a mano
    # (workflow_dispatch) si al empezar ven que feeds/candidates.json no es del día.
    - cron: "7 6 * * 1-5"    # 07:07 Madrid en invierno · 08:07 en verano
    - cron: "37 6 * * 1-5"   # 07:37 Madrid en invierno · 08:37 en verano
    - cron: "7 7 * * 1-5"    # 08:07 Madrid en invierno · 09:07 en verano
    - cron: "33 7 * * 1-5"   # 08:33 Madrid en invierno · 09:33 en verano
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "feeds/feeds.json"
      - "tools/collect_feeds.py"
      - ".github/workflows/collect-feeds.yml"

permissions:
  contents: write

concurrency:
  group: collect-feeds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11
      - run: python tools/collect_feeds.py
      - name: Guardar candidatas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/candidates.json feeds/candidates.txt data/news.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Candidatas RSS $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
