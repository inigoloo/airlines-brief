name: Recoger candidatas (RSS)

on:
  # Sin "schedule": el programador de GitHub retrasaba las ejecuciones hasta 12 horas (20 y 23-nov-2026).
  # La lanza cada día laborable a las 8:28 (Madrid) la tarea programada de Claude «Airlines Brief · Lanzar recogida RSS»,
  # y las tareas de Destacadas y Breves la lanzan a mano si al empezar ven que feeds/candidates.json no es del día.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "feeds/feeds.json"
      - "tools/collect_feeds.py"
      - ".github/workflows/collect-feeds.yml"

permissions:
  contents: write

concurrency:
  group: collect-feeds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11
      - run: python tools/collect_feeds.py
      - name: Guardar candidatas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/candidates.json feeds/candidates.txt data/news.json data/likes.md
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Candidatas RSS $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
