name: Recoger candidatas (RSS)

on:
  # Sin "schedule": el programador de GitHub retrasaba las ejecuciones hasta 12 horas (20 y 23-nov-2026).
  # La lanza cada día laborable a las 8:28 (Madrid) la tarea programada de Claude «Airlines Brief · Lanzar recogida RSS»,
  # y las tareas de Destacadas y Breves la lanzan a mano si al empezar ven que feeds/candidates.json no es del día.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "feeds/feeds.json"
      - "tools/collect_feeds.py"
      - ".github/workflows/collect-feeds.yml"

permissions:
  contents: write

concurrency:
  group: collect-feeds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11
      - name: Recoger y guardar candidatas
        # Los ficheros que genera son desechables: si main avanzó mientras tanto (otra recogida, una tarea que publica),
        # no se fusionan; se vuelve a partir del main actual, se regenera y se reintenta. Así nunca hay conflictos.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard FETCH_HEAD
            python tools/collect_feeds.py
            git add feeds/candidates.json feeds/candidates.txt data/news.json data/likes.md
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -q -m "Candidatas RSS $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "main avanzó; regenero y reintento ($i)"; sleep $((5 * i))
          done
          exit 1
