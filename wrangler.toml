# Cloudflare Worker (connected to GitHub, branch main): static files from dist/ plus the /api functions.
name = "airlines-brief"
main = "cf/worker.js"
compatibility_date = "2025-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "airlines-brief"
database_id = "30c260cb-fbd4-4cb7-9c39-ceff23a685b6"
